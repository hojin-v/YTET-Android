name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to create or update, for example v0.1.0 or nightly"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          android_home="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdkmanager_bin="$android_home/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager_bin" ]]; then
            sdkmanager_bin="$(find "$android_home/cmdline-tools" -type f -path "*/bin/sdkmanager" 2>/dev/null | sort | tail -n 1 || true)"
          fi
          if [[ -z "$sdkmanager_bin" || ! -x "$sdkmanager_bin" ]]; then
            echo "sdkmanager not found under $android_home" >&2
            exit 127
          fi
          "$sdkmanager_bin" --version
          yes | "$sdkmanager_bin" --licenses >/dev/null || true
          "$sdkmanager_bin" "platforms;android-36" "build-tools;36.0.0"

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            version="${{ github.ref_name }}"
          else
            version="nightly"
          fi
          if [[ "$version" == "nightly" ]]; then
            formal=false
          elif [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            formal=true
          else
            echo "::error::Release version must be nightly or a formal tag like v1.2.3."
            exit 1
          fi
          {
            echo "version=$version"
            echo "formal=$formal"
          } >> "$GITHUB_OUTPUT"

      - name: Export Android version
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          if [[ "$version" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            patch="${BASH_REMATCH[3]}"
            version_name="${major}.${minor}.${patch}-android"
            version_code=$((10#$major * 1000000 + 10#$minor * 1000 + 10#$patch))
            gradle_test_task=":app:testStableDebugUnitTest"
            gradle_build_task=":app:assembleStableRelease"
            apk_path="app/build/outputs/apk/stable/release/app-stable-release.apk"
            apk_asset="RabbYT-Android-${version}.apk"
            zip_asset="RabbYT-Android-${version}-android.zip"
            legacy_apk_asset="YTET-Android-${version}.apk"
            legacy_zip_asset="YTET-Android-${version}-android.zip"
          else
            latest_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
            if [[ "$latest_tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              major="${BASH_REMATCH[1]}"
              minor="${BASH_REMATCH[2]}"
              patch=$((10#${BASH_REMATCH[3]} + 1))
            else
              major=0
              minor=1
              patch=0
            fi
            version_name="${major}.${minor}.${patch}-beta.${GITHUB_RUN_NUMBER}"
            version_code=$((900000000 + GITHUB_RUN_NUMBER))
            gradle_test_task=":app:testNightlyDebugUnitTest"
            gradle_build_task=":app:assembleNightlyRelease"
            apk_path="app/build/outputs/apk/nightly/release/app-nightly-release.apk"
            apk_asset="RabbYT-Beta.apk"
            zip_asset="RabbYT-Beta-android.zip"
            legacy_apk_asset="YTET-Beta.apk"
            legacy_zip_asset="YTET-Beta-android.zip"
          fi
          {
            echo "YTET_VERSION_NAME=$version_name"
            echo "YTET_VERSION_CODE=$version_code"
            echo "YTET_GRADLE_TEST_TASK=$gradle_test_task"
            echo "YTET_GRADLE_BUILD_TASK=$gradle_build_task"
            echo "YTET_APK_PATH=$apk_path"
            echo "YTET_APK_ASSET_NAME=$apk_asset"
            echo "YTET_ZIP_ASSET_NAME=$zip_asset"
            echo "YTET_LEGACY_APK_ASSET_NAME=$legacy_apk_asset"
            echo "YTET_LEGACY_ZIP_ASSET_NAME=$legacy_zip_asset"
            echo "YTET_DIST_APK=dist/$apk_asset"
            echo "YTET_DIST_ZIP=dist/$zip_asset"
            echo "YTET_LEGACY_DIST_APK=dist/$legacy_apk_asset"
            echo "YTET_LEGACY_DIST_ZIP=dist/$legacy_zip_asset"
          } >> "$GITHUB_ENV"

      - name: Configure release APK signing
        id: signing
        shell: bash
        env:
          YTET_SIGNING_KEYSTORE_BASE64: ${{ secrets.YTET_SIGNING_KEYSTORE_BASE64 }}
          YTET_SIGNING_STORE_PASSWORD: ${{ secrets.YTET_SIGNING_STORE_PASSWORD }}
          YTET_SIGNING_KEY_ALIAS: ${{ secrets.YTET_SIGNING_KEY_ALIAS }}
          YTET_SIGNING_KEY_PASSWORD: ${{ secrets.YTET_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in \
            YTET_SIGNING_KEYSTORE_BASE64 \
            YTET_SIGNING_STORE_PASSWORD \
            YTET_SIGNING_KEY_ALIAS \
            YTET_SIGNING_KEY_PASSWORD
          do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name secret is required for release APK signing."
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            if [[ "${{ steps.version.outputs.formal }}" == "true" ]]; then
              exit 1
            fi
            echo "::warning::Signing secrets are incomplete; skipping nightly release publishing."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          keystore="$RUNNER_TEMP/ytet-release-signing.jks"
          printf '%s' "$YTET_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          if ! keytool -list \
              -keystore "$keystore" \
              -storepass "$YTET_SIGNING_STORE_PASSWORD" \
              -alias "$YTET_SIGNING_KEY_ALIAS" >/dev/null; then
            if [[ "${{ steps.version.outputs.formal }}" == "true" ]]; then
              echo "::error::Release signing keystore, password, or alias is invalid."
              exit 1
            fi
            echo "::warning::Release signing is invalid; skipping nightly release publishing."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "YTET_SIGNING_STORE_FILE=$keystore"
            echo "YTET_SIGNING_STORE_PASSWORD=$YTET_SIGNING_STORE_PASSWORD"
            echo "YTET_SIGNING_KEY_ALIAS=$YTET_SIGNING_KEY_ALIAS"
            echo "YTET_SIGNING_KEY_PASSWORD=$YTET_SIGNING_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Verify project structure
        if: steps.signing.outputs.configured == 'true'
        run: |
          chmod +x scripts/verify_static.sh
          scripts/verify_static.sh

      - name: Run Python engine unit tests
        if: steps.signing.outputs.configured == 'true'
        run: |
          chmod +x scripts/test_python_engine.sh
          scripts/test_python_engine.sh

      - name: Run JVM unit tests
        if: steps.signing.outputs.configured == 'true'
        run: ./gradlew --no-daemon "$YTET_GRADLE_TEST_TASK" --warning-mode all

      - name: Build RabbYT Android
        if: steps.signing.outputs.configured == 'true'
        run: ./gradlew --no-daemon clean "$YTET_GRADLE_BUILD_TASK" --warning-mode all

      - name: Verify release APK signature
        if: steps.signing.outputs.configured == 'true'
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify \
            --verbose \
            "$YTET_APK_PATH"

      - name: Verify APK runtime packaging
        if: steps.signing.outputs.configured == 'true'
        run: |
          chmod +x scripts/verify_apk_runtime.sh
          scripts/verify_apk_runtime.sh "$YTET_APK_PATH"

      - name: Package release assets
        if: steps.signing.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          apk="$YTET_APK_PATH"
          if [[ ! -f "$apk" ]]; then
            echo "::error::Signed release APK not found. Check release signing secrets."
            exit 1
          fi
          mkdir -p dist
          cp "$apk" "$YTET_DIST_APK"
          cp "$apk" "$YTET_LEGACY_DIST_APK"
          cp README.md dist/
          (cd dist && jar --create --file "$YTET_ZIP_ASSET_NAME" "$YTET_APK_ASSET_NAME" README.md)
          (cd dist && jar --create --file "$YTET_LEGACY_ZIP_ASSET_NAME" "$YTET_LEGACY_APK_ASSET_NAME" README.md)

      - name: Upload workflow artifact
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: RabbYT-Android-${{ steps.version.outputs.version }}-android
          path: |
            dist/*.apk
            dist/*.zip
          if-no-files-found: error
          retention-days: ${{ steps.version.outputs.version == 'nightly' && 7 || 30 }}

      - name: Publish GitHub Release
        if: steps.signing.outputs.configured == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          tag="$RELEASE_VERSION"
          release_assets=(
            "$YTET_DIST_APK"
            "$YTET_DIST_ZIP"
            "$YTET_LEGACY_DIST_APK"
            "$YTET_LEGACY_DIST_ZIP"
          )

          title="RabbYT Android $tag"
          notes_file="$RUNNER_TEMP/release-notes.md"
          tag_notes="$(git for-each-ref "refs/tags/$tag" --format='%(contents)' || true)"
          if [[ -n "${tag_notes//[[:space:]]/}" ]]; then
            printf '%s\n' "$tag_notes" > "$notes_file"
          else
            {
              echo "RabbYT Android $tag"
              echo
              echo "패치노트"
              echo "- 정식 릴리즈 빌드입니다."
            } > "$notes_file"
          fi
          prerelease_flag=""
          if [[ "$tag" == "nightly" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -f nightly "$GITHUB_SHA"
            git push origin refs/tags/nightly --force
            title="Nightly"
            {
              echo "Nightly"
              echo
              echo "패치노트"
              echo "- 베타 버전: $YTET_VERSION_NAME"
              echo "- 빌드: beta.$GITHUB_RUN_NUMBER"
              echo "- main 브랜치 최신 커밋을 기반으로 한 개발자 검증용 Beta 빌드입니다."
              echo "- 정식 RabbYT 앱과 별도 앱으로 설치됩니다."
              echo "- 커밋: $GITHUB_SHA"
            } > "$notes_file"
            prerelease_flag="--prerelease"
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            if [[ "$tag" == "nightly" ]]; then
              while IFS= read -r asset_name; do
                [[ -z "$asset_name" ]] && continue
                gh release delete-asset "$tag" "$asset_name" -y || true
              done < <(gh release view "$tag" --json assets -q '.assets[].name')
            fi
            gh release upload "$tag" "${release_assets[@]}" --clobber
            if [[ -n "$prerelease_flag" ]]; then
              gh release edit "$tag" --title "$title" --notes-file "$notes_file" "$prerelease_flag"
            else
              gh release edit "$tag" --title "$title" --notes-file "$notes_file"
            fi
          else
            if [[ -n "$prerelease_flag" ]]; then
              gh release create "$tag" "${release_assets[@]}" --title "$title" --notes-file "$notes_file" "$prerelease_flag"
            else
              gh release create "$tag" "${release_assets[@]}" --title "$title" --notes-file "$notes_file"
            fi
          fi
