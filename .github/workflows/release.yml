name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to create or update, for example v0.1.0"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          android_home="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdkmanager_bin="$android_home/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager_bin" ]]; then
            sdkmanager_bin="$(find "$android_home/cmdline-tools" -type f -path "*/bin/sdkmanager" 2>/dev/null | sort | tail -n 1 || true)"
          fi
          if [[ -z "$sdkmanager_bin" || ! -x "$sdkmanager_bin" ]]; then
            echo "sdkmanager not found under $android_home" >&2
            exit 127
          fi
          "$sdkmanager_bin" --version
          yes | "$sdkmanager_bin" --licenses >/dev/null || true
          "$sdkmanager_bin" "platforms;android-36" "build-tools;36.0.0"

      - name: Configure release APK signing
        shell: bash
        env:
          YTET_SIGNING_KEYSTORE_BASE64: ${{ secrets.YTET_SIGNING_KEYSTORE_BASE64 }}
          YTET_SIGNING_STORE_PASSWORD: ${{ secrets.YTET_SIGNING_STORE_PASSWORD }}
          YTET_SIGNING_KEY_ALIAS: ${{ secrets.YTET_SIGNING_KEY_ALIAS }}
          YTET_SIGNING_KEY_PASSWORD: ${{ secrets.YTET_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in \
            YTET_SIGNING_KEYSTORE_BASE64 \
            YTET_SIGNING_STORE_PASSWORD \
            YTET_SIGNING_KEY_ALIAS \
            YTET_SIGNING_KEY_PASSWORD
          do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name secret is required for release APK signing."
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi
          keystore="$RUNNER_TEMP/ytet-release-signing.jks"
          printf '%s' "$YTET_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          keytool -list \
            -keystore "$keystore" \
            -storepass "$YTET_SIGNING_STORE_PASSWORD" \
            -alias "$YTET_SIGNING_KEY_ALIAS" >/dev/null
          {
            echo "YTET_SIGNING_STORE_FILE=$keystore"
            echo "YTET_SIGNING_STORE_PASSWORD=$YTET_SIGNING_STORE_PASSWORD"
            echo "YTET_SIGNING_KEY_ALIAS=$YTET_SIGNING_KEY_ALIAS"
            echo "YTET_SIGNING_KEY_PASSWORD=$YTET_SIGNING_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            version="${{ github.ref_name }}"
          else
            version="nightly"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Export Android version for formal release
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          if [[ "$version" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            patch="${BASH_REMATCH[3]}"
            version_name="${major}.${minor}.${patch}-android"
            version_code=$((10#$major * 1000000 + 10#$minor * 1000 + 10#$patch))
            {
              echo "YTET_VERSION_NAME=$version_name"
              echo "YTET_VERSION_CODE=$version_code"
            } >> "$GITHUB_ENV"
          else
            echo "Release version '$version' is not a formal Android version tag; keeping the Gradle default version."
          fi

      - name: Verify project structure
        run: |
          chmod +x scripts/verify_static.sh
          scripts/verify_static.sh

      - name: Run Python engine unit tests
        run: |
          chmod +x scripts/test_python_engine.sh
          scripts/test_python_engine.sh

      - name: Run JVM unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest --warning-mode all

      - name: Build YTET Android
        run: ./gradlew --no-daemon clean :app:assembleRelease --warning-mode all

      - name: Verify release APK signature
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify \
            --verbose \
            app/build/outputs/apk/release/app-release.apk

      - name: Verify APK runtime packaging
        run: |
          chmod +x scripts/verify_apk_runtime.sh
          scripts/verify_apk_runtime.sh app/build/outputs/apk/release/app-release.apk

      - name: Package release assets
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          apk="app/build/outputs/apk/release/app-release.apk"
          if [[ ! -f "$apk" ]]; then
            echo "::error::Signed release APK not found. Check release signing secrets."
            exit 1
          fi
          mkdir -p dist
          cp "$apk" "dist/YTET-Android-${version}.apk"
          cp README.md docs/PORTING.md dist/
          (cd dist && jar --create --file "YTET-Android-${version}-android.zip" "YTET-Android-${version}.apk" README.md PORTING.md)

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: YTET-Android-${{ steps.version.outputs.version }}-android
          path: |
            dist/YTET-Android-${{ steps.version.outputs.version }}.apk
            dist/YTET-Android-${{ steps.version.outputs.version }}-android.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          tag="$RELEASE_VERSION"
          apk="dist/YTET-Android-${tag}.apk"
          zip="dist/YTET-Android-${tag}-android.zip"

          if [[ "$tag" == "nightly" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -f nightly "$GITHUB_SHA"
            git push origin refs/tags/nightly --force
            title="YTET Android Nightly"
            notes="Automated Android release build from $GITHUB_SHA. Includes embedded Python yt-dlp runtime and arm64 FFmpegKit remuxing; see README before distribution."
            prerelease_flag="--prerelease"
          else
            title="YTET Android $tag"
            notes="Automated YTET Android release build for $tag. Includes embedded Python yt-dlp runtime and arm64 FFmpegKit remuxing; see README before distribution."
            prerelease_flag=""
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" "$zip" --clobber
            if [[ -n "$prerelease_flag" ]]; then
              gh release edit "$tag" --title "$title" --notes "$notes" "$prerelease_flag"
            else
              gh release edit "$tag" --title "$title" --notes "$notes"
            fi
          else
            if [[ -n "$prerelease_flag" ]]; then
              gh release create "$tag" "$apk" "$zip" --title "$title" --notes "$notes" "$prerelease_flag"
            else
              gh release create "$tag" "$apk" "$zip" --title "$title" --notes "$notes"
            fi
          fi
