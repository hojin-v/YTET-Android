plugins {
    id "com.android.application"
    id "com.chaquo.python"
}

android {
    namespace = "com.ytet.android"
    compileSdk = 36

    defaultConfig {
        applicationId = "com.ytet.android"
        minSdk = 26
        targetSdk = 36
        versionCode = 2
        versionName = "0.1.1-android"

        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

}

chaquopy {
    defaultConfig {
        version = "3.12"
        buildPython "python3.12"
        pip {
            install("yt-dlp==2026.3.17")
        }
    }
}
