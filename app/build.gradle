plugins {
    id "com.android.application"
    id "com.chaquo.python"
}

def ytetSigningStoreFile = providers.environmentVariable("YTET_SIGNING_STORE_FILE").orNull
def ytetSigningStorePassword = providers.environmentVariable("YTET_SIGNING_STORE_PASSWORD").orNull
def ytetSigningKeyAlias = providers.environmentVariable("YTET_SIGNING_KEY_ALIAS").orNull
def ytetSigningKeyPassword = providers.environmentVariable("YTET_SIGNING_KEY_PASSWORD").orNull
def ytetSigningConfigured = ytetSigningStoreFile != null
        && ytetSigningStorePassword != null
        && ytetSigningKeyAlias != null
        && ytetSigningKeyPassword != null
def ytetVersionName = providers.environmentVariable("YTET_VERSION_NAME")
        .orElse("0.1.3-android")
        .get()
def ytetVersionCode = providers.environmentVariable("YTET_VERSION_CODE")
        .map { it.toInteger() }
        .orElse(4)
        .get()

android {
    namespace = "com.ytet.android"
    compileSdk = 36

    defaultConfig {
        applicationId = "com.ytet.android"
        minSdk = 26
        targetSdk = 36
        versionCode = ytetVersionCode
        versionName = ytetVersionName

        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildFeatures {
        buildConfig = true
    }

    flavorDimensions "channel"
    productFlavors {
        stable {
            dimension "channel"
            applicationId = "com.ytet.android"
            buildConfigField "String", "UPDATE_CHANNEL", "\"stable\""
            manifestPlaceholders = [
                    updateApkAuthority: "com.ytet.android.updateapk"
            ]
        }
        nightly {
            dimension "channel"
            applicationId = "com.ytet.android.beta"
            buildConfigField "String", "UPDATE_CHANNEL", "\"nightly\""
            manifestPlaceholders = [
                    updateApkAuthority: "com.ytet.android.beta.updateapk"
            ]
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    signingConfigs {
        ytetRelease {
            if (ytetSigningConfigured) {
                storeFile = file(ytetSigningStoreFile)
                storePassword = ytetSigningStorePassword
                keyAlias = ytetSigningKeyAlias
                keyPassword = ytetSigningKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (ytetSigningConfigured) {
                signingConfig = signingConfigs.ytetRelease
            }
        }
    }
}

dependencies {
    implementation "androidx.recyclerview:recyclerview:1.4.0"
    implementation "com.mrljdx:ffmpeg-kit-full:6.1.4"
    testImplementation "junit:junit:4.13.2"
}

chaquopy {
    defaultConfig {
        version = "3.12"
        buildPython "python3.12"
        pip {
            install("yt-dlp==2026.3.17")
            install("yt-dlp-ejs==0.8.0")
            install("mutagen==1.47.0")
        }
    }
}
